<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTS Diesel Fuel - User Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="storage-tanks"></div>

    <div class="login-container">
        <div class="logo-section">
            <div class="logo">
                <div class="logo-text">
                    <span class="pts-text">PTSI</span>
                    <div class="fuel-badge">
                        <span class="droplet"></span>
                        <span>Diesel Fuel</span>
                    </div>
                </div>
            </div>
            <p class="subtitle">Fuel Blending Management System</p>
        </div>

        <h2>USER LOGIN</h2>

        <form id="loginForm">
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Masukkan username" required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Masukkan password" required>
            </div>

            <div class="forgot-password">
                <a href="#forgot">Forgot Password?</a>
            </div>

            <button type="submit" class="login-button">Login</button>
        </form>

        <div class="signup-section">
            <p>Don't have an account? <a href="#signup">Sign Up</a></p>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>

</html>
